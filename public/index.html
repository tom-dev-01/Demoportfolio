<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management Dashboard | Portfolio Project</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ... (your existing CSS stays exactly as you have it) ... */
        /* I'm omitting the CSS here for brevity – keep your original styles */
    </style>
</head>

<body>

    <!-- Your existing HTML structure (navbar, stats, etc.) stays unchanged -->

    <script>

        /* =========================================
           IMPORTANT API CONFIGURATION
        ========================================= */

        const API_BASE_URL = '';
        const API_URL = `${API_BASE_URL}/api/users`;
        const HEALTH_URL = `${API_BASE_URL}/health`;

        /* =========================================
           SAFE FETCH HELPER
        ========================================= */

        async function apiRequest(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...(options.headers || {})
                }
            });

            const contentType = response.headers.get('content-type') || '';
            let data;

            if (contentType.includes('application/json')) {
                data = await response.json();
            } else {
                const text = await response.text();
                throw new Error(
                    `Server returned an invalid response (${response.status}): ${text.substring(0, 150)}`
                );
            }

            if (!response.ok) {
                throw new Error(
                    data.error || data.message || `Request failed with status ${response.status}`
                );
            }

            return data;
        }

        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHTML(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        /* =========================================
           SHOW MESSAGE
        ========================================= */

        function showMessage(message, type = 'success') {
            const messageDiv = document.getElementById('addMessage');
            messageDiv.innerHTML = `
                <div class="${type}">
                    ${type === 'success' ? '✓' : '❌'}
                    ${escapeHTML(message)}
                </div>
            `;
            setTimeout(() => { messageDiv.innerHTML = ''; }, 5000);
        }

        /* =========================================
           HELPER: Get Full Name from User Object
        ========================================= */

        function getUserFullName(user) {
            // If name exists, use it
            if (user.name && user.name.trim() !== '') {
                return user.name.trim();
            }
            // Otherwise combine first_name and last_name if present
            const firstName = user.first_name || '';
            const lastName = user.last_name || '';
            const combined = `${firstName} ${lastName}`.trim();
            if (combined !== '') {
                return combined;
            }
            // Fallback
            return 'Unknown User';
        }

        /* =========================================
           HELPER: Get Initials from User
        ========================================= */

        function getUserInitials(user) {
            const fullName = getUserFullName(user);
            if (fullName === 'Unknown User') return 'U';
            const parts = fullName.split(' ');
            let initials = parts.map(part => part.charAt(0).toUpperCase()).join('');
            return initials.substring(0, 2) || 'U';
        }

        /* =========================================
           CHECK API
        ========================================= */

        async function checkAPI() {
            const apiStatus = document.getElementById('apiStatus');
            const systemStatus = document.getElementById('systemStatus');

            try {
                const response = await fetch(HEALTH_URL);
                if (!response.ok) throw new Error('API unavailable');
                const data = await response.json();
                apiStatus.textContent = 'Connected';
                systemStatus.textContent = data.database === 'connected' ? 'Active' : 'Online';
            } catch (error) {
                console.error('HEALTH CHECK ERROR:', error);
                apiStatus.textContent = 'Offline';
                systemStatus.textContent = 'Unavailable';
            }
        }

        /* =========================================
           FETCH USERS
        ========================================= */

        async function fetchUsers() {
            const container = document.getElementById('users-container');
            container.innerHTML = `<div class="loading">Loading users...</div>`;

            try {
                const data = await apiRequest(API_URL);

                // Handle both direct array and { users: [...] } responses
                let users = data;
                if (Array.isArray(data)) {
                    users = data;
                } else if (data.users && Array.isArray(data.users)) {
                    users = data.users;
                } else {
                    throw new Error('Unexpected API response format');
                }

                document.getElementById('totalUsers').textContent = users.length;

                if (users.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size:42px">📭</div>
                            <strong>No users yet</strong>
                            <p>Add your first user to get started.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = users.map(user => {
                    const fullName = getUserFullName(user);
                    const safeName = escapeHTML(fullName);
                    const safeEmail = escapeHTML(user.email || '');
                    const initials = getUserInitials(user);
                    const userId = user.id || '?';

                    return `
                        <div class="user-item" data-id="${userId}">
                            <div class="user-info">
                                <div class="avatar">${escapeHTML(initials)}</div>
                                <div class="user-details">
                                    <div class="user-name">${safeName}</div>
                                    <div class="user-email">${safeEmail}</div>
                                    <span class="user-id">USER #${userId}</span>
                                </div>
                            </div>
                            <div class="user-actions">
                                <button type="button" class="btn btn-warning" onclick="editUser(${userId})">✏️ Edit</button>
                                <button type="button" class="btn btn-danger" onclick="deleteUser(${userId})">🗑 Delete</button>
                            </div>
                            <div id="edit-form-${userId}" class="edit-form hidden">
                                <div class="form-group">
                                    <input type="text" id="edit-name-${userId}" value="${safeName}" placeholder="Name" required>
                                    <input type="email" id="edit-email-${userId}" value="${safeEmail}" placeholder="Email" required>
                                    <button type="button" class="btn btn-success" onclick="updateUser(${userId})">💾 Save</button>
                                    <button type="button" class="btn btn-danger" onclick="cancelEdit(${userId})">Cancel</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('FETCH USERS ERROR:', error);
                document.getElementById('totalUsers').textContent = '0';
                container.innerHTML = `
                    <div class="error">
                        ❌ Unable to load users.
                        <br><br>
                        ${escapeHTML(error.message)}
                    </div>
                `;
            }
        }

        /* =========================================
           ADD USER
        ========================================= */

        document.getElementById('addUserForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const nameInput = document.getElementById('nameInput');
            const emailInput = document.getElementById('emailInput');
            const button = document.getElementById('addUserButton');

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();

            if (!name || !email) {
                showMessage('Name and email are required.', 'error');
                return;
            }

            button.disabled = true;
            button.textContent = 'Adding...';

            try {
                const data = await apiRequest(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ name, email })
                });
                showMessage(data.message || 'User added successfully', 'success');
                nameInput.value = '';
                emailInput.value = '';
                await fetchUsers();
            } catch (error) {
                console.error('ADD USER ERROR:', error);
                showMessage(error.message, 'error');
            } finally {
                button.disabled = false;
                button.textContent = '+ Add User';
            }
        });

        /* =========================================
           EDIT / CANCEL / UPDATE / DELETE
        ========================================= */

        function editUser(id) {
            const editForm = document.getElementById(`edit-form-${id}`);
            if (!editForm) return;
            document.querySelectorAll('.edit-form').forEach(form => {
                if (form.id !== `edit-form-${id}`) form.classList.add('hidden');
            });
            editForm.classList.toggle('hidden');
        }

        function cancelEdit(id) {
            const editForm = document.getElementById(`edit-form-${id}`);
            if (editForm) editForm.classList.add('hidden');
        }

        async function updateUser(id) {
            const nameInput = document.getElementById(`edit-name-${id}`);
            const emailInput = document.getElementById(`edit-email-${id}`);
            if (!nameInput || !emailInput) return;

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();

            if (!name || !email) {
                alert('Name and email are required.');
                return;
            }

            try {
                const data = await apiRequest(`${API_URL}/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ name, email })
                });
                alert(`✓ ${data.message || 'User updated successfully'}`);
                await fetchUsers();
            } catch (error) {
                console.error('UPDATE USER ERROR:', error);
                alert(`❌ ${error.message}`);
            }
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            try {
                const data = await apiRequest(`${API_URL}/${id}`, { method: 'DELETE' });
                alert(`✓ ${data.message || 'User deleted successfully'}`);
                await fetchUsers();
            } catch (error) {
                console.error('DELETE USER ERROR:', error);
                alert(`❌ ${error.message}`);
            }
        }

        /* =========================================
           INITIALIZE
        ========================================= */

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('API URL:', API_URL);
            await checkAPI();
            await fetchUsers();
        });

    </script>

</body>
</html>
